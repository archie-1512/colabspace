# Build → push to ECR → deploy to EC2, on every push to main.
# AWS access uses GitHub's OIDC token to assume an IAM role: no AWS keys are
# stored in GitHub. Deployment runs through SSM, so no SSH port is open.
# Setup steps: DEPLOY.md, section 7.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on EC2 via SSM
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commands=[\"sudo -u ec2-user /opt/collabspace/deploy.sh ${GITHUB_SHA}\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"
          # Poll for up to ~15 minutes (the built-in waiter gives up after ~100s,
          # shorter than an image pull plus the health check on a small instance).
          for i in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          RESULT=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID")
          echo "$RESULT" | jq -r '.StandardOutputContent'
          echo "$RESULT" | jq -r '.StandardErrorContent'
          STATUS=$(echo "$RESULT" | jq -r '.Status')
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ]
